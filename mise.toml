[plugins]
raku = "https://github.com/fifitrixabelle/mise-raku.git"

[tools]
python = "3.15.2"
uv = "0.13.6"
go = "1.27.3"
erlang = "29.1.2"
elixir = "1.20.4-otp-29"
ruby = "4.0.9"
rust = "1.99.1"
perl = "5.44.0.0"
raku = "2026.02"
zig = "0.17.0"
clojure = "1.12.6.1673"
lua = "5.5.1"
julia = { version = "1.13.3", checksum_expr = '"sha256:" + filter(fromJSON(body)[version + ""].files, { #.url == url })[0].sha256', checksum_url = "https://julialang-s3.julialang.org/bin/versions.json", platforms = { linux-arm64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/linux/aarch64/julia-latest-linuxaarch64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/linux/aarch64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-linux-aarch64.tar.gz{% endif %}""" }, linux-x64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/linux/x64/julia-latest-linux64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/linux/x64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-linux-x86_64.tar.gz{% endif %}""" }, macos-arm64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/mac/aarch64/julia-latest-macaarch64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/mac/aarch64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-macaarch64.tar.gz{% endif %}""" }, macos-x64 = { url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/mac/x64/julia-latest-mac64.tar.gz{% else %}https://julialang-s3.julialang.org/bin/mac/x64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-mac64.tar.gz{% endif %}""" }, windows-x64 = { format = "zip", url = """{% if version == "nightly" %}https://julialangnightlies-s3.julialang.org/bin/winnt/x64/julia-latest-win64.zip{% else %}https://julialang-s3.julialang.org/bin/winnt/x64/{{ (version | split(pat='.'))[0:2] | join(sep='.') }}/julia-{{ version }}-win64.zip{% endif %}""" } }, version_date_expr = 'let all = fromJSON(body); map(keys(all), { let v = #; let dated = filter(all[v].files, { #["last-modified"] != nil }); [v, len(dated) > 0 ? dated[0]["last-modified"] : ""] })', version_expr = 'sortVersions(filter(keys(fromJSON(body)), { # matches "^\\d+\\.\\d+\\.\\d+(-[0-9A-Za-z\\.-]+)?$" }))', version_list_url = "https://julialang-s3.julialang.org/bin/versions.json" }
scala-cli = "1.18.0"
java = "temurin-21.0.13+9.0.LTS"
bun = "1.4.4"
deno = "2.9.8"
crystal = "1.22.1"
gleam = "1.19.2"

[tasks.go-test]
run = "go test ./..."
dir = "go"

[tasks.go-fun]
run = "go run ./cmd/fun"
dir = "go"

[tasks.default]
run = """
set -euo pipefail

mise run build
echo

python scripts/mise_progress.py \
  --label "Running all language demos via mise" \
  go-fun \
  bun-main \
  deno-main \
  crystal-main \
  gleam-main \
  py-polars-duckdb \
  elixir-explorer \
  ruby-main \
  rust-duckdb-polars \
  raku-main \
  raku-test \
  zig-main \
  lua-main \
  clojure-main \
  julia-main \
  perl-main \
  scala-main

echo "============================================================"
echo "All demos completed successfully"
echo "============================================================"
"""

[tasks.build]
run = """
set -euo pipefail

python scripts/mise_progress.py \
  --label "Building compiled examples via mise" \
  go-build \
  rust-build \
  crystal-build \
  gleam-build \
  elixir-build \
  zig-build \
  scala-build

echo "============================================================"
echo "All buildable examples compiled successfully"
echo "============================================================"
"""

[tasks.go-main]
run = "go run ."
dir = "go"

[tasks.go-build]
run = """
mkdir -p ../tmp/build/go
go build -o ../tmp/build/go/main main.go
go build -o ../tmp/build/go/fun ./cmd/fun
"""
dir = "go"

[tasks.bun-main]
run = "bun run main.ts"
dir = "bun"

[tasks.deno-main]
run = "deno run main.ts"
dir = "deno"

[tasks.crystal-main]
run = "crystal run main.cr"
dir = "crystal"

[tasks.crystal-build]
run = """
mkdir -p ../tmp/build
crystal build main.cr -o ../tmp/build/crystal-main
"""
dir = "crystal"

[tasks.gleam-main]
run = "gleam run"
dir = "gleam"

[tasks.gleam-build]
run = "gleam build"
dir = "gleam"

[tasks.py-main]
run = "uv run python main.py"
dir = "python"

[tasks.py-polars-duckdb]
run = "uv run python polars_duckdb_demo.py"
dir = "python"

[tasks.py-marimo]
run = "uv run marimo run marimo_data_app.py"
dir = "python"

[tasks.py-test]
run = "uv run pytest"
dir = "python"

[tasks.elixir-test]
run = "mix test"
dir = "elixir/hello_app"

[tasks.elixir-explorer]
run = "elixir explorer_demo.exs"
dir = "elixir/hello_app"

[tasks.elixir-build]
run = "mix compile"
dir = "elixir/hello_app"

[tasks.ruby-main]
run = "bundle install && bundle exec ruby -W0 main.rb"
dir = "ruby"

[tasks.ruby-sinatra]
run = "bundle install && bundle exec ruby -W0 sinatra.rb"
dir = "ruby"

[tasks.ruby-duckdb-daru]
run = "bundle install && ruby duckdb_daru_demo.rb"
dir = "ruby"

[tasks.rust-hello]
run = "cargo run --bin hello"
dir = "rust"

[tasks.rust-duckdb-polars]
run = "cargo run --bin duckdb_polars_demo"
dir = "rust"

[tasks.rust-build]
run = "cargo build --bins"
dir = "rust"

[tasks.raku-main]
run = "raku main.raku"
dir = "raku"

[tasks.raku-test]
run = "raku test.raku"
dir = "raku"

[tasks.zig-main]
run = """
set -euo pipefail
arch=$(uname -m)
os=$(uname -s)
case "$arch" in
  arm64|aarch64) zig_arch="aarch64" ;;
  x86_64|amd64) zig_arch="x86_64" ;;
  *) zig_arch="$arch" ;;
esac
case "$os" in
  Darwin) zig_os="macos" ;;
  Linux) zig_os="linux" ;;
  *) echo "Unsupported OS for zig task: $os" >&2; exit 1 ;;
esac
zig run -target "${zig_arch}-${zig_os}" main.zig
"""
dir = "zig"

[tasks.zig-help]
run = """
set -euo pipefail
arch=$(uname -m)
os=$(uname -s)
case "$arch" in
  arm64|aarch64) zig_arch="aarch64" ;;
  x86_64|amd64) zig_arch="x86_64" ;;
  *) zig_arch="$arch" ;;
esac
case "$os" in
  Darwin) zig_os="macos" ;;
  Linux) zig_os="linux" ;;
  *) echo "Unsupported OS for zig task: $os" >&2; exit 1 ;;
esac
zig run -target "${zig_arch}-${zig_os}" main.zig -- help
"""
dir = "zig"

[tasks.zig-build]
run = """
set -euo pipefail
mkdir -p ../tmp/build
arch=$(uname -m)
os=$(uname -s)
case "$arch" in
  arm64|aarch64) zig_arch="aarch64" ;;
  x86_64|amd64) zig_arch="x86_64" ;;
  *) zig_arch="$arch" ;;
esac
case "$os" in
  Darwin) zig_os="macos" ;;
  Linux) zig_os="linux" ;;
  *) echo "Unsupported OS for zig task: $os" >&2; exit 1 ;;
esac
zig build-exe main.zig -target "${zig_arch}-${zig_os}" -femit-bin=../tmp/build/zig-main
"""
dir = "zig"

[tasks.lua-main]
run = "lua main.lua"
dir = "lua"

[tasks.clojure-main]
run = "clojure -M main.clj"
dir = "clojure"

[tasks.clojure-tablecloth-duckdb]
run = "clojure -Sdeps '{:deps {org.clojure/clojure {:mvn/version \"1.11.1\"} org.duckdb/duckdb_jdbc {:mvn/version \"1.2.1\"} com.github.seancorfield/next.jdbc {:mvn/version \"1.3.1002\"} scicloj/tablecloth {:mvn/version \"7.029\"}}}' -M tablecloth_duckdb_demo.clj"
dir = "clojure"

[tasks.julia-main]
run = "julia main.jl"
dir = "julia"

[tasks.julia-duckdb-dataframes]
run = "julia duckdb_dataframes_demo.jl"
dir = "julia"

[tasks.perl-main]
run = "perl main.pl"
dir = "perl"

[tasks.scala-main]
run = "scala-cli run Main.scala --server=false"
dir = "scala"

[tasks.scala-duckdb-tablesaw]
run = "scala-cli run duckdb_tablesaw_demo.sc --server=false"
dir = "scala"

[tasks.scala-build]
run = "scala-cli compile Main.scala duckdb_tablesaw_demo.sc --server=false"
dir = "scala"
